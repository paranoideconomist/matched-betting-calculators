<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Lay Calculator</title>
    
    <!-- Unique Multi-Lay Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Deep, modern dark mode palette */
            --bg-main: #09090b;      /* Zinc 950 */
            --card-bg: #18181b;      /* Zinc 900 */
            --accent: #09090b;       /* Zinc 950 for inset areas */
            --border: #27272a;       /* Zinc 800 */
            --border-hover: #3f3f46; /* Zinc 700 */
            
            /* Typography */
            --text-main: #f4f4f5;    /* Zinc 50 */
            --text-muted: #a1a1aa;   /* Zinc 400 */
            
            /* Brand & Accents */
            --primary: #14b8a6;      /* Teal 500 Theme for Multi-Lay */
            --primary-glow: rgba(20, 184, 166, 0.4);
            --primary-hover: #0d9488; /* Teal 600 */
            
            /* Status Colors */
            --success: #10b981;      
            --success-bg: rgba(16, 185, 129, 0.1);
            --danger: #ef4444;        
            --danger-bg: rgba(239, 68, 68, 0.1);
            
            --warning-border: #b45309;
            --warning-bg: rgba(180, 83, 9, 0.1);
            --warning-text: #f59e0b;
            
            /* Override Theme Colors */
            --override-border: rgba(20, 184, 166, 0.5);
            --override-bg: rgba(20, 184, 166, 0.05);
            --override-text: #2dd4bf;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px 10px; 
            -webkit-font-smoothing: antialiased;
        }

        .workspace-header {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, var(--card-bg), var(--bg-main));
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-top: 1px solid #3f3f46;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .workspace-header h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            color: #ffffff; 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace-header h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .acca-card {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border);
            border-top: 1px solid #3f3f46;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .acca-header { 
            background: var(--accent); 
            padding: 12px 20px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .acca-body { padding: 20px; }
        
        .config-bar { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            background: var(--accent); 
            border: 1px solid var(--border); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
        }

        label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: inherit;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-main);
            box-shadow: 0 0 0 2px var(--primary-glow), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        input::placeholder, textarea::placeholder {
            color: #52525b;
        }

        textarea {
            resize: none;
            overflow: hidden;
            min-height: 40px;
            height: 40px;
        }

        .title-input {
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            background: transparent;
            padding: 4px 8px;
            max-width: 300px;
            box-shadow: none;
            border-radius: 4px;
        }
        
        .title-input:focus {
            background: var(--bg-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: white; 
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-primary:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--primary-glow);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-danger { 
            background: transparent; 
            color: var(--danger); 
            border: 1px solid var(--danger);
        }
        .btn-danger:hover { 
            background: var(--danger-bg); 
        }

        .btn-secondary { 
            background: var(--bg-main); 
            color: var(--text-muted); 
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        .leg-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr 2fr 1.2fr 1.2fr 40px; 
            gap: 12px; 
            align-items: start; 
            background: var(--accent); 
            border: 1px solid var(--border); 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            transition: all 0.2s ease; 
        }
        
        .leg-row:hover {
            border-color: var(--border-hover);
            background: #0c0c0e;
        }

        .calculated-display {
            font-weight: 800;
            color: var(--primary);
            text-align: right;
            padding-right: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            text-shadow: 0 0 10px var(--primary-glow);
            margin-top: 6px;
        }
        
        .liab-display {
            color: var(--danger);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .strategy-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-main);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .strategy-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-strat {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            background: var(--accent);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-strat:hover, .btn-strat.active {
            background: var(--override-bg);
            border-color: var(--override-border);
            color: var(--override-text);
        }

        .override-input { 
            background-color: var(--override-bg); 
            border-color: var(--override-border); 
            color: var(--override-text); 
            font-weight: 700;
            font-size: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .override-input:focus { border-color: var(--override-text); box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2), inset 0 2px 4px rgba(0,0,0,0.2); }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            margin-top: 10px;
            padding: 0;
            border: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .outputs-table-wrapper {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--accent);
        }

        .outputs-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.9rem; 
        }

        .outputs-table th { 
            text-align: left; 
            padding: 16px; 
            color: var(--text-muted); 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border); 
            background: rgba(255,255,255,0.02); 
        }

        .outputs-table td { 
            padding: 16px; 
            border-bottom: 1px solid var(--border); 
        }
        
        .outputs-table tr:last-child td {
            border-bottom: none;
        }
        
        .win-cell { background-color: var(--success-bg); color: var(--success); font-weight: 800; border-left: 2px solid var(--success); }
        .loss-cell { background-color: var(--danger-bg); color: var(--danger); font-weight: 800; border-left: 2px solid var(--danger); }
        .mono-text { font-family: 'JetBrains Mono', monospace; font-size: 1rem; }
        
        .leg-header-row {
            display: grid; 
            grid-template-columns: 2fr 1fr 2fr 1.2fr 1.2fr 40px;  
            gap: 12px; 
            padding: 0 12px 12px 12px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .controls-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--accent);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 12px;
            gap: 20px;
        }

        .max-liability-banner {
            background: var(--warning-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--warning-border);
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--warning-text);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .max-liability-banner strong {
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
        }

        @media (max-width: 850px) {
            input, select, textarea { padding: 12px; font-size: 16px; }
            .btn { padding: 12px 20px; font-size: 1rem; }
            .workspace-header, .acca-header { flex-direction: column; align-items: stretch; gap: 15px; }
            .controls-footer { flex-direction: column; align-items: stretch; }
            .title-input { max-width: 100%; }
            .leg-header-row { display: none; }
            .leg-row {
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 40px 20px 20px 20px;
                position: relative;
            }
            .close-btn { position: absolute; top: 12px; right: 12px; }
            .calculated-display { 
                text-align: left !important; 
                padding: 12px; 
                background: rgba(255,255,255,0.03); 
                border-radius: 8px; 
                border: 1px solid var(--border);
                margin: 0;
            }
            .calculated-display::before { 
                content: attr(data-mobile-label); 
                color: var(--text-muted); 
                font-size: 0.8rem; 
                font-family: 'Plus Jakarta Sans', sans-serif;
                text-transform: uppercase; 
                display: block;
                margin-bottom: 4px;
            }
            .input-wrap { width: 100%; }
            .input-wrap::before {
                content: attr(data-label);
                display: block;
                font-size: 0.8rem;
                font-weight: 800;
                color: var(--text-muted);
                text-transform: uppercase;
                margin-bottom: 6px;
            }

            .outputs-table-wrapper {
                background: transparent;
                border: none;
            }
            .outputs-table thead { display: none; }
            .outputs-table, .outputs-table tbody, .outputs-table tr, .outputs-table td {
                display: block;
                width: 100%;
            }
            .outputs-table tr {
                background: var(--accent);
                border-radius: 12px;
                margin-bottom: 15px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
            .outputs-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                border-left: none !important;
            }
            .outputs-table td:last-child {
                border-bottom: none;
            }
            .outputs-table td::before {
                content: attr(data-label);
                font-weight: 800;
                color: var(--text-muted);
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
                margin-right: 15px;
                text-align: left;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

<div class="workspace-header">
    <h1>Multi Lay Calculator</h1>
    <button class="btn btn-primary" onclick="createNewInstance()">+ New Setup</button>
</div>

<div id="workspaceRoot"></div>

<script>
    let mlInstances = [];
    let instanceIdCounter = 0;
    
    // Updated key for local storage state
    const STORAGE_KEY = 'mlCalcsState_v2';
    const ID_KEY = 'mlCalcIdCounter_v2';

    function autoGrow(element) {
        element.style.height = "auto";
        element.style.height = (element.scrollHeight) + "px";
    }
    
    function init() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            try {
                mlInstances = JSON.parse(savedData);
                instanceIdCounter = parseInt(localStorage.getItem(ID_KEY)) || mlInstances.length;
                
                // State Migration for partialLays per leg
                mlInstances.forEach(inst => {
                    inst.legs.forEach(leg => {
                        if (!leg.partialLays) leg.partialLays = [];
                    });
                });

                renderWorkspace();
            } catch (e) {
                createNewInstance();
            }
        } else {
            createNewInstance();
        }
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mlInstances));
        localStorage.setItem(ID_KEY, instanceIdCounter);
    }

    function createNewInstance() {
        const id = instanceIdCounter++;
        mlInstances.push({
            id: id,
            title: `Multi-Lay Setup #${mlInstances.length + 1}`,
            betType: "normal",
            backStake: "",
            backOdds: "",
            commission: "",
            globalMultiplier: 100,
            legs: [
                { name: "", odds: "", bias: 100, actualLay: "", partialLays: [] },
                { name: "", odds: "", bias: 100, actualLay: "", partialLays: [] }
            ]
        });
        saveState();
        renderWorkspace();
    }

    function removeInstance(id) {
        mlInstances = mlInstances.filter(item => item.id !== id);
        saveState();
        renderWorkspace();
    }

    function resetCalc(id) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;
        
        inst.betType = "normal";
        inst.backStake = "";
        inst.backOdds = "";
        inst.commission = "";
        inst.globalMultiplier = 100;
        inst.legs = [
            { name: "", odds: "", bias: 100, actualLay: "", partialLays: [] },
            { name: "", odds: "", bias: 100, actualLay: "", partialLays: [] }
        ];
        
        saveState();
        renderWorkspace();
    }

    function addLegToInstance(id) {
        const inst = mlInstances.find(item => item.id === id);
        if (inst && inst.legs.length < 8) { 
            inst.legs.push({ name: "", odds: "", bias: 100, actualLay: "", partialLays: [] });
            saveState();
            renderWorkspace();
        }
    }

    function removeLegFromInstance(id, index) {
        const inst = mlInstances.find(item => item.id === id);
        if (inst && inst.legs.length > 2) {
            inst.legs.splice(index, 1);
            saveState();
            renderWorkspace();
        }
    }

    function addPartialLay(id, legIndex) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays.push({ stake: "", odds: "", comm: "" });
        calculateInstance(id);
        saveState();
        renderWorkspace();
    }

    function updatePartialLay(id, legIndex, pIndex, key, value) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays[pIndex][key] = value;
        calculateInstance(id);
        saveState();
    }

    function removePartialLay(id, legIndex, pIndex) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays.splice(pIndex, 1);
        calculateInstance(id);
        saveState();
        renderWorkspace();
    }

    function updateField(id, key, value, index = null) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;
        
        if (index !== null) {
            inst.legs[index][key] = value;
            if (key === 'bias') {
                const label = document.getElementById(`bias_label_${id}_${index}`);
                const slider = document.getElementById(`bias_slider_${id}_${index}`);
                if (label) label.innerText = value;
                if (slider && document.activeElement !== slider) slider.value = value;
            }
        } else {
            inst[key] = value;
            if (key === 'globalMultiplier') {
                const numInput = document.getElementById(`global_override_${id}`);
                const slider = document.getElementById(`global_slider_${id}`);
                if (numInput && document.activeElement !== numInput) numInput.value = value;
                if (slider && document.activeElement !== slider) slider.value = value;
                
                document.querySelectorAll(`#strat_group_${id} .btn-strat`).forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.val === String(value)) btn.classList.add('active');
                });
            }
        }
        
        calculateInstance(id);
        saveState();
    }

    function calculateInstance(id) {
        const inst = mlInstances.find(item => item.id === id);
        if (!inst) return;

        const isSNR = (inst.betType === 'snr');
        const bStake = parseFloat(inst.backStake) || 0;
        const bOdds = parseFloat(inst.backOdds) || 0;
        const globalComm = (parseFloat(inst.commission) || 0) / 100;
        const globalMult = (parseFloat(inst.globalMultiplier) || 0) / 100;
        
        const totalReturn = isSNR ? (bStake * (bOdds - 1)) : (bStake * bOdds);
        const netBackCost = isSNR ? 0 : bStake;
        const backWinsPnl = totalReturn - netBackCost; 

        let legsData = [];
        let cumulativeLayWins = 0;
        let maxLiability = 0;

        inst.legs.forEach((leg, i) => {
            const lOdds = parseFloat(leg.odds) || 0;
            const lBias = (parseFloat(leg.bias) || 0) / 100;
            
            let targetAdvisedLay = 0;
            if (lOdds > 1 && totalReturn > 0) {
                targetAdvisedLay = (totalReturn / (lOdds - globalComm)) * lBias * globalMult;
            }

            // Sum up existing matched partial lays for this selection
            let pStakeSum = 0;
            let pLiabilitySum = 0;
            let pNetPayoutSum = 0;

            if (leg.partialLays && leg.partialLays.length > 0) {
                leg.partialLays.forEach(p => {
                    let ps = parseFloat(p.stake) || 0;
                    let po = parseFloat(p.odds) || 0;
                    let pc = (parseFloat(p.comm !== "" && p.comm !== undefined ? p.comm : inst.commission) || 0) / 100;
                    
                    pStakeSum += ps;
                    pLiabilitySum += ps * Math.max(0, po - 1);
                    pNetPayoutSum += ps * (1 - pc);
                });
            }

            const usedVal = parseFloat(leg.actualLay);
            const remainingLayToPlace = isNaN(usedVal) ? Math.max(0, targetAdvisedLay - pStakeSum) : usedVal;
            
            const remainingLiability = remainingLayToPlace * (Math.max(1, lOdds) - 1);
            const remainingNetPayout = remainingLayToPlace * (1 - globalComm);

            const totalSelectionStake = pStakeSum + remainingLayToPlace;
            const totalSelectionLiability = pLiabilitySum + remainingLiability;
            const totalSelectionNetLayWin = pNetPayoutSum + remainingNetPayout;
            
            cumulativeLayWins += totalSelectionNetLayWin;
            if (totalSelectionLiability > maxLiability) maxLiability = totalSelectionLiability;

            legsData.push({ 
                targetAdvisedLay, 
                totalSelectionStake,
                totalSelectionLiability, 
                totalSelectionNetLayWin 
            });

            const advisedDisplay = document.getElementById(`advised_${id}_${i}`);
            if (advisedDisplay) advisedDisplay.innerText = `£${targetAdvisedLay.toFixed(2)}`;
            
            const liabDisplay = document.getElementById(`liab_${id}_${i}`);
            if (liabDisplay) liabDisplay.innerText = `£${totalSelectionLiability.toFixed(2)}`;

            const inputEl = document.getElementById(`override_${id}_${i}`);
            const sliderEl = document.getElementById(`slider_${id}_${i}`);

            if (inputEl && document.activeElement !== inputEl) {
                inputEl.value = (leg.actualLay === '' || leg.actualLay === undefined) ? '' : remainingLayToPlace.toFixed(2);
                inputEl.placeholder = `£${Math.max(0, targetAdvisedLay - pStakeSum).toFixed(2)}`;
            }

            if (sliderEl) {
                const calculatedMax = Math.max(targetAdvisedLay * 2, remainingLayToPlace, 0.01);
                sliderEl.max = calculatedMax.toFixed(2);
                if (document.activeElement !== sliderEl) {
                    sliderEl.value = remainingLayToPlace.toFixed(2);
                }
            }
        });

        const resultsTable = document.getElementById(`results_${id}`);
        const maxLiabDisplay = document.getElementById(`max_liab_${id}`);
        if (!resultsTable) return;

        let html = '';

        const backLosesNet = cumulativeLayWins - netBackCost;
        
        html += `<tr>
            <td data-label="Scenario Condition"><strong>Back Bet Loses / Alt. Outcome</strong></td>
            <td data-label="Back Bet P/L" style="color:${netBackCost > 0 ? 'var(--danger)' : 'var(--text-main)'}">£${(-netBackCost).toFixed(2)}</td>
            <td data-label="Winning Lays P/L" style="color:var(--success)">+£${cumulativeLayWins.toFixed(2)}</td>
            <td data-label="Liability Paid" style="color:var(--text-muted)">-</td>
            <td data-label="Net P&L Result" class="${backLosesNet >= 0 ? 'win-cell' : 'loss-cell'} mono-text">£${backLosesNet.toFixed(2)}</td>
        </tr>`;

        legsData.forEach((ld, i) => {
            const leg = inst.legs[i];
            const otherLaysWin = cumulativeLayWins - ld.totalSelectionNetLayWin;
            const netTotal = backWinsPnl + otherLaysWin - ld.totalSelectionLiability;

            html += `<tr>
                <td data-label="Scenario Condition">If <strong>${leg.name || `Leg ${i+1}`}</strong> Hits</td>
                <td data-label="Back Bet P/L" style="color:var(--success)">+£${backWinsPnl.toFixed(2)}</td>
                <td data-label="Winning Lays P/L" style="color:var(--success)">+£${otherLaysWin.toFixed(2)}</td>
                <td data-label="Liability Paid" style="color:var(--danger)">-£${ld.totalSelectionLiability.toFixed(2)}</td>
                <td data-label="Net P&L Result" class="${netTotal >= 0 ? 'win-cell' : 'loss-cell'} mono-text">£${netTotal.toFixed(2)}</td>
            </tr>`;
        });

        resultsTable.innerHTML = html;
        if(maxLiabDisplay) maxLiabDisplay.innerText = maxLiability.toFixed(2);
    }

    function renderWorkspace() {
        const root = document.getElementById('workspaceRoot');
        root.innerHTML = '';
        
        mlInstances.forEach(inst => {
            const card = document.createElement('div');
            card.className = 'acca-card';
            
            let legsHtml = '';
            inst.legs.forEach((leg, index) => {
                const partialsCount = leg.partialLays ? leg.partialLays.length : 0;
                
                let partialRowsHtml = '';
                if (leg.partialLays && leg.partialLays.length > 0) {
                    partialRowsHtml = leg.partialLays.map((p, pIdx) => `
                        <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);">
                            <div style="flex:1;">
                                <input type="number" step="0.01" value="${p.stake}" placeholder="Stake (£)" style="padding:4px 8px; font-size:0.8rem;" oninput="updatePartialLay(${inst.id}, ${index}, ${pIdx}, 'stake', this.value)">
                            </div>
                            <div style="flex:1;">
                                <input type="number" step="0.01" value="${p.odds}" placeholder="Odds" style="padding:4px 8px; font-size:0.8rem;" oninput="updatePartialLay(${inst.id}, ${index}, ${pIdx}, 'odds', this.value)">
                            </div>
                            <button class="btn" style="background:transparent; color:var(--danger); border:1px solid var(--danger); padding:2px 8px; font-size:0.75rem;" onclick="removePartialLay(${inst.id}, ${index}, ${pIdx})">✕</button>
                        </div>
                    `).join('');
                }

                legsHtml += `
                    <div class="leg-row">
                        <div class="input-wrap" data-label="Event / Selection">
                            <textarea rows="1" placeholder="Score/Outcome" oninput="updateField(${inst.id}, 'name', this.value, ${index}); autoGrow(this)">${leg.name}</textarea>
                        </div>
                        <div class="input-wrap" data-label="Lay Odds">
                            <input type="number" value="${leg.odds}" step="0.05" placeholder="Odds" oninput="updateField(${inst.id}, 'odds', this.value, ${index})">
                        </div>
                        <div class="input-wrap" data-label="Target Weight / Bias">
                            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                                <label style="margin-bottom:0; color:var(--override-text);">Bias: <span id="bias_label_${inst.id}_${index}">${leg.bias}</span>%</label>
                                <button class="btn" style="background: var(--bg-main); color: var(--text-muted); border: 1px solid var(--border); padding: 2px 8px; font-size: 0.65rem;" onclick="updateField(${inst.id}, 'bias', 100, ${index})" title="Reset to 100%">↺ 100%</button>
                            </div>
                            <input type="range" id="bias_slider_${inst.id}_${index}" min="0" max="200" step="1" value="${leg.bias}" oninput="updateField(${inst.id}, 'bias', this.value, ${index})">
                        </div>
                        <div class="input-wrap" data-label="Calculated Target">
                            <div class="calculated-display" data-mobile-label="Calculated Lay" id="advised_${inst.id}_${index}">£0.00</div>
                        </div>
                        <div class="input-wrap" data-label="Total Exposure">
                            <div class="calculated-display liab-display" data-mobile-label="Liability" id="liab_${inst.id}_${index}">£0.00</div>
                        </div>
                        <button class="btn-secondary close-btn" style="border-radius:8px; width:32px; height:32px; padding:0; cursor:pointer;" onclick="removeLegFromInstance(${inst.id}, ${index})" ${inst.legs.length <= 2 ? 'disabled style="opacity:0.2;"' : ''}>✕</button>

                        <!-- Sub-panel for Partial Lay Entries -->
                        <div style="grid-column: 1 / -1; margin-top: 4px; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                <button class="btn" style="background: var(--bg-main); color: var(--primary); border: 1px solid var(--primary); padding: 4px 8px; font-size: 0.75rem; border-radius: 6px;" onclick="addPartialLay(${inst.id}, ${index})">+ Add Matched Lay</button>
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <label style="margin:0; font-size:0.7rem;">Additional Lay Stake Required:</label>
                                    <input type="number" id="override_${inst.id}_${index}" class="override-input" value="${leg.actualLay || ''}" placeholder="${partialsCount > 0 ? 'Remaining Lay' : '£0.00'}" step="0.01" style="width:120px; padding:4px 8px;" oninput="updateField(${inst.id}, 'actualLay', this.value, ${index})">
                                    <button class="btn" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 2px 6px; font-size: 0.65rem; border-radius: 4px;" onclick="updateField(${inst.id}, 'actualLay', '', ${index})" title="Reset to target">↺ Reset</button>
                                </div>
                            </div>
                            <input type="range" id="slider_${inst.id}_${index}" class="lay-slider" min="0" max="100" step="0.01" value="${leg.actualLay || 0}" oninput="updateField(${inst.id}, 'actualLay', this.value, ${index})">
                            ${partialRowsHtml}
                        </div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="acca-header">
                    <input type="text" class="title-input" value="${inst.title}" oninput="updateField(${inst.id}, 'title', this.value)">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border);" onclick="resetCalc(${inst.id})">Reset</button>
                        <button class="btn btn-danger" onclick="removeInstance(${inst.id})">Close</button>
                    </div>
                </div>
                <div class="acca-body">
                    <div class="config-bar">
                        <div>
                            <label>Bet Style Profile</label>
                            <select onchange="updateField(${inst.id}, 'betType', this.value);">
                                <option value="normal" ${inst.betType === 'normal' ? 'selected' : ''}>Normal Qualifying</option>
                                <option value="snr" ${inst.betType === 'snr' ? 'selected' : ''}>Free Bet (SNR)</option>
                            </select>
                        </div>
                        <div>
                            <label>Back Stake (£)</label>
                            <input type="number" step="0.5" placeholder="0.00" value="${inst.backStake}" oninput="updateField(${inst.id}, 'backStake', this.value)">
                        </div>
                        <div>
                            <label>Total Back Odds</label>
                            <input type="number" value="${inst.backOdds}" placeholder="0.00" step="0.5" oninput="updateField(${inst.id}, 'backOdds', this.value)">
                        </div>
                        <div>
                            <label>Global Exchange Comm (%)</label>
                            <input type="number" value="${inst.commission}" placeholder="0" step="0.1" oninput="updateField(${inst.id}, 'commission', this.value)">
                        </div>
                    </div>
                    
                    <div class="legs-container">
                        <div class="leg-header-row">
                            <div>Outcome Selection</div>
                            <div>Lay Odds</div>
                            <div>Target Weight / Bias</div>
                            <div style="text-align: right; padding-right: 10px;">Calculated Target</div>
                            <div style="text-align: right; padding-right: 10px;">Total Exposure</div>
                            <div></div>
                        </div>
                        ${legsHtml}
                    </div>

                    <div class="controls-footer">
                        <div class="strategy-group" id="strat_group_${inst.id}" style="flex:1; max-width: 450px; margin: 0;">
                            <label style="color:var(--override-text);">Global Scaling Multiplier</label>
                            <div class="strategy-buttons">
                                <button class="btn-strat ${inst.globalMultiplier == 80 ? 'active' : ''}" data-val="80" onclick="updateField(${inst.id}, 'globalMultiplier', 80)">80% (Under)</button>
                                <button class="btn-strat ${inst.globalMultiplier == 100 ? 'active' : ''}" data-val="100" onclick="updateField(${inst.id}, 'globalMultiplier', 100)">100% (Std)</button>
                                <button class="btn-strat ${inst.globalMultiplier == 120 ? 'active' : ''}" data-val="120" onclick="updateField(${inst.id}, 'globalMultiplier', 120)">120% (Over)</button>
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center; margin-top: 5px;">
                                <div style="display:flex; align-items:center; gap: 4px;">
                                    <input type="number" id="global_override_${inst.id}" class="override-input" step="1" value="${inst.globalMultiplier}" oninput="updateField(${inst.id}, 'globalMultiplier', this.value)">
                                    <span style="color: var(--text-muted); font-weight: 800; font-size: 0.9rem;">%</span>
                                </div>
                                <input type="range" id="global_slider_${inst.id}" style="flex:1;" min="0" max="200" step="1" value="${inst.globalMultiplier}" oninput="updateField(${inst.id}, 'globalMultiplier', this.value)">
                            </div>
                        </div>
                        <button class="btn btn-secondary" style="border-color: var(--primary); color: var(--primary); height: fit-content; padding: 12px 24px;" onclick="addLegToInstance(${inst.id})" ${inst.legs.length >= 8 ? 'disabled' : ''}>+ Add Selection</button>
                    </div>
                    
                    <div class="outputs-section" style="margin-top: 30px;">
                        <h4 style="margin:0; color:var(--text-main); font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; display:flex; align-items:center; gap:8px;">
                            <span style="display:inline-block; width:8px; height:8px; background:var(--primary); border-radius:50%; box-shadow:0 0 8px var(--primary-glow);"></span>
                            Bet Settlement Calculations
                        </h4>
                        <div class="outputs-table-wrapper">
                            <table class="outputs-table">
                                <thead>
                                    <tr>
                                        <th>Scenario Condition</th>
                                        <th>Back Bet P/L</th>
                                        <th>Winning Lays P/L</th>
                                        <th>Liability Paid</th>
                                        <th>Net P&L Result</th>
                                    </tr>
                                </thead>
                                <tbody id="results_${inst.id}"></tbody>
                            </table>
                        </div>
                        <div class="max-liability-banner">
                            <strong>Max Exchange Exposure: £<span id="max_liab_${inst.id}">0.00</span></strong>
                            <span>Since these scorelines are mutually exclusive, your exchange only needs to hold liability for the largest single threat.</span>
                        </div>
                    </div>
                </div>
            `;
            root.appendChild(card);
            
            card.querySelectorAll('textarea').forEach(el => {
                autoGrow(el);
            });
            
            calculateInstance(inst.id);
        });
    }

    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequential Calc</title>
    
    <!-- Unique Sequential Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #09090b;      
            --card-bg: #18181b;      
            --accent: #09090b;        
            --border: #27272a;        
            --border-hover: #3f3f46;  
            
            --text-main: #f4f4f5;    
            --text-muted: #a1a1aa;    
            
            --primary: #a855f7;       
            --primary-glow: rgba(168, 85, 247, 0.4);
            --primary-hover: #9333ea; 
            
            --success: #10b981;      
            --success-bg: rgba(16, 185, 129, 0.1);
            --danger: #ef4444;        
            --danger-bg: rgba(239, 68, 68, 0.1);
            
            --override-border: rgba(245, 158, 11, 0.5);
            --override-bg: rgba(245, 158, 11, 0.05);
            --override-text: #f59e0b; 

            --insurance-glow: rgba(16, 185, 129, 0.3);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px 10px; 
            -webkit-font-smoothing: antialiased;
        }

        .workspace-header {
            max-width: 1500px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(145deg, var(--card-bg), var(--bg-main));
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-top: 1px solid #3f3f46;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .workspace-header h1 { 
            margin: 0; 
            font-size: 1.5rem; 
            color: #ffffff; 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .workspace-header h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .acca-card {
            max-width: 1500px;
            margin: 0 auto 20px auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border);
            border-top: 1px solid #3f3f46;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .acca-header { 
            background: var(--accent); 
            padding: 12px 20px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        
        .acca-body { padding: 20px; }
        
        .config-bar { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            background: var(--accent); 
            border: 1px solid var(--border); 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            align-items: start;
        }

        .insurance-panel {
            grid-column: 1 / -1;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 5px;
        }

        .insurance-warning {
            grid-column: 1 / -1;
            font-size: 0.8rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: -5px;
        }

        label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-main);
            box-shadow: 0 0 0 2px var(--primary-glow), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 0;
        }

        .toggle-wrap input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
            box-shadow: none;
            margin: 0;
        }

        .toggle-wrap label { margin: 0; color: var(--text-main); cursor: pointer; }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input::placeholder, textarea::placeholder { color: #52525b; }
        textarea { resize: none; overflow: hidden; min-height: 40px; height: 40px; }

        .title-input {
            font-size: 1.2rem;
            font-weight: 800;
            border: none;
            background: transparent;
            padding: 4px 8px;
            max-width: 300px;
            box-shadow: none;
            border-radius: 4px;
            min-width: 0;
            width: 100%;
        }
        
        .title-input:focus {
            background: var(--bg-main);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .override-input { 
            background-color: var(--override-bg); 
            border-color: var(--override-border); 
            color: var(--override-text); 
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .override-input:focus {
            border-color: var(--override-text);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .strategy-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-main);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .strategy-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-strat {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            background: var(--accent);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        .btn-strat:hover, .btn-strat.active {
            background: var(--override-bg);
            border-color: var(--override-border);
            color: var(--override-text);
        }

        textarea.notes-input { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            background-color: transparent;
            border: 1px dashed transparent;
            box-shadow: none;
        }
        
        textarea.notes-input:hover, textarea.notes-input:focus {
            border-color: var(--border);
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { 
            background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
            color: white; 
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-primary:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--primary-glow);
        }
        .btn-primary:active { transform: translateY(1px); }

        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger-bg); }

        .btn-secondary { background: var(--bg-main); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }

        .leg-row { 
            display: grid; 
            grid-template-columns: 40px 1.5fr 0.8fr 0.8fr 1.1fr 1fr 1.6fr 60px 1fr 40px; 
            gap: 12px; 
            align-items: start; 
            background: var(--accent); 
            border: 1px solid var(--border); 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 10px; 
            transition: all 0.2s ease; 
        }
        
        .leg-row:hover { border-color: var(--border-hover); background: #0c0c0e; }
        .leg-row.completed { 
            filter: grayscale(1) brightness(0.6);
            opacity: 0.6;
            border-color: var(--border);
        }

        .leg-num { 
            font-weight: 800; 
            color: var(--text-muted); 
            text-align: center;
            background: var(--border);
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            margin: 6px auto 0 auto;
        }

        .advised-display {
            font-weight: 800;
            color: var(--primary);
            text-align: right;
            padding-right: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            text-shadow: 0 0 10px var(--primary-glow);
            line-height: 1.3;
            margin-top: 6px;
        }

        .liab-display {
            color: var(--danger);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .rec-lay-text {
            font-size: 0.70rem;
            color: var(--override-text);
            text-shadow: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
            margin-top: 2px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            margin-top: 10px;
            padding: 0;
            border: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .actual-lay-group { display: flex; flex-direction: column; gap: 4px; }
        .lay-slider { margin-top: 4px !important; }

        .done-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
            margin: 8px auto 0 auto;
            display: block;
            border-radius: 4px;
        }

        .outputs-table-wrapper {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--accent);
        }

        .outputs-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .outputs-table th { 
            text-align: left; 
            padding: 16px; 
            color: var(--text-muted); 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            border-bottom: 1px solid var(--border); 
            background: rgba(255,255,255,0.02); 
        }
        .outputs-table td { padding: 16px; border-bottom: 1px solid var(--border); }
        .outputs-table tr:last-child td { border-bottom: none; }
        
        .win-cell { background-color: var(--success-bg); color: var(--success); font-weight: 800; border-left: 2px solid var(--success); }
        .loss-cell { background-color: var(--danger-bg); color: var(--danger); font-weight: 800; border-left: 2px solid var(--danger); }
        .refund-cell { color: var(--success); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        .path-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .path-badge.win { background-color: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .path-badge.loss { background-color: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .path-arrow { color: var(--border-hover); font-size: 0.8rem; font-weight: bold; margin: 0 4px; }
        .path-container { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 2px; max-width: 100%; }
        
        .leg-header-row {
            display: grid; 
            grid-template-columns: 40px 1.5fr 0.8fr 0.8fr 1.1fr 1fr 1.6fr 60px 1fr 40px; 
            gap: 12px; 
            padding: 0 12px 12px 12px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Mobile specific fixes */
        @media (max-width: 1000px) {
            input, select, textarea { padding: 12px; font-size: 16px; }
            .btn { padding: 12px 20px; font-size: 1rem; }
            .workspace-header, .acca-header { flex-direction: column; align-items: stretch; gap: 15px; }
            .title-input { max-width: 100%; }
            .leg-header-row { display: none; }
            .insurance-panel { grid-template-columns: 1fr; }
            .leg-row {
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 40px 20px 20px 20px;
                position: relative;
            }
            .leg-num { position: absolute; top: 12px; left: 15px; margin: 0; }
            .close-btn { position: absolute; top: 12px; right: 12px; }
            
            .advised-display { 
                text-align: left !important; 
                padding: 12px; 
                background: rgba(255,255,255,0.03); 
                border-radius: 8px; 
                border: 1px solid var(--border);
                margin: 0;
            }
            .advised-display::before { 
                content: attr(data-mobile-label);
                color: var(--text-muted); 
                font-size: 0.8rem; 
                font-family: 'Plus Jakarta Sans', sans-serif;
                text-transform: uppercase; 
                display: block;
                margin-bottom: 4px;
            }
            
            .leg-done { 
                flex-direction: row; 
                justify-content: space-between; 
                background: rgba(255,255,255,0.03); 
                padding: 12px; 
                border-radius: 8px; 
                width: 100%; 
                border: 1px solid var(--border);
            }
            .leg-done::before { 
                content: "Mark Leg as Done:"; 
                font-weight: 800; 
                color: var(--text-main); 
                font-size: 0.85rem; 
            }
            .done-checkbox { margin: 0; }
            
            .input-wrap, .actual-lay-group { width: 100%; }
            .input-wrap::before, .actual-lay-group::before {
                content: attr(data-label);
                display: block;
                font-size: 0.8rem;
                font-weight: 800;
                color: var(--text-muted);
                text-transform: uppercase;
                margin-bottom: 6px;
            }

            .outputs-table-wrapper {
                background: transparent;
                border: none;
            }
            .outputs-table thead { display: none; }
            .outputs-table, .outputs-table tbody, .outputs-table tr, .outputs-table td {
                display: block;
                width: 100%;
            }
            .outputs-table tr {
                background: var(--accent);
                border-radius: 12px;
                margin-bottom: 15px;
                border: 1px solid var(--border);
                overflow: hidden;
            }
            .outputs-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                border-left: none !important;
            }
            .outputs-table td:last-child {
                border-bottom: none;
            }
            .outputs-table td::before {
                content: attr(data-label);
                font-weight: 800;
                color: var(--text-muted);
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
                margin-right: 15px;
                text-align: left;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

<div class="workspace-header">
    <h1>Sequential Lay Calculator</h1>
    <button class="btn btn-primary" onclick="createNewAcca()">+ New Setup</button>
</div>

<div id="workspaceRoot"></div>

<script>
    let accaInstances = [];
    let instanceIdCounter = 0;
    
    // Constants for local storage
    const STORAGE_KEY = 'seqCalcsState_v2';
    const ID_KEY = 'seqCalcIdCounter_v2';

    function autoGrow(element) {
        element.style.height = "auto";
        element.style.height = (element.scrollHeight) + "px";
    }

    function init() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            try {
                accaInstances = JSON.parse(savedData);
                instanceIdCounter = parseInt(localStorage.getItem(ID_KEY)) || accaInstances.length;
                
                // Migrate state for partialLays per leg
                accaInstances.forEach(inst => {
                    inst.legs.forEach(leg => {
                        if (!leg.partialLays) leg.partialLays = [];
                    });
                });

                renderWorkspace();
            } catch (e) {
                createNewAcca();
            }
        } else {
            createNewAcca();
        }
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(accaInstances));
        localStorage.setItem(ID_KEY, instanceIdCounter);
    }

    function createNewAcca() {
        const id = instanceIdCounter++;
        accaInstances.push({
            id: id,
            title: `Accumulator Session #${accaInstances.length + 1}`,
            betType: "normal",
            isInsurance: false,
            refundValue: "10.00",
            refundRetention: "80",
            underlayBias: 100,
            backStake: "",
            backOdds: "",
            legs: [
                { name: "", odds: "", commission: "", actualLay: "", notes: "", completed: false, partialLays: [] },
                { name: "", odds: "", commission: "", actualLay: "", notes: "", completed: false, partialLays: [] }
            ]
        });
        saveState();
        renderWorkspace();
    }

    function removeInstance(id) {
        accaInstances = accaInstances.filter(item => item.id !== id);
        saveState();
        renderWorkspace();
    }

    function resetCalc(id) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;
        
        inst.betType = "normal";
        inst.isInsurance = false;
        inst.refundValue = "10.00";
        inst.refundRetention = "80";
        inst.underlayBias = 100;
        inst.backStake = "";
        inst.backOdds = "";
        inst.legs = [
            { name: "", odds: "", commission: "", actualLay: "", notes: "", completed: false, partialLays: [] },
            { name: "", odds: "", commission: "", actualLay: "", notes: "", completed: false, partialLays: [] }
        ];
        
        saveState();
        renderWorkspace();
    }

    function addLegToInstance(id) {
        const inst = accaInstances.find(item => item.id === id);
        if (inst && inst.legs.length < 10) {
            inst.legs.push({ name: "", odds: "", commission: "", actualLay: "", notes: "", completed: false, partialLays: [] });
            saveState();
            renderWorkspace();
        }
    }

    function removeLegFromInstance(id, index) {
        const inst = accaInstances.find(item => item.id === id);
        if (inst && inst.legs.length > 2) {
            inst.legs.splice(index, 1);
            saveState();
            renderWorkspace();
        }
    }

    function addPartialLay(id, legIndex) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays.push({ stake: "", odds: "", comm: "" });
        calculateInstance(id);
        saveState();
        renderWorkspace();
    }

    function updatePartialLay(id, legIndex, pIndex, key, value) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays[pIndex][key] = value;
        calculateInstance(id);
        saveState();
    }

    function removePartialLay(id, legIndex, pIndex) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;
        inst.legs[legIndex].partialLays.splice(pIndex, 1);
        calculateInstance(id);
        saveState();
        renderWorkspace();
    }

    function updateField(id, key, value, index = null) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;
        
        if (index !== null) {
            inst.legs[index][key] = value;
            if (key === 'completed') {
                const row = document.getElementById(`leg_row_${id}_${index}`);
                if (row) row.classList.toggle('completed', value);
            }
        } else {
            inst[key] = value;
            
            if (key === 'underlayBias') {
                const numInput = document.getElementById(`bias_override_${id}`);
                const slider = document.getElementById(`bias_slider_${id}`);
                if (numInput && document.activeElement !== numInput) numInput.value = value;
                if (slider && document.activeElement !== slider) slider.value = value;
                
                document.querySelectorAll(`#strat_group_${id} .btn-strat`).forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.val === String(value)) btn.classList.add('active');
                });
            }
        }
        
        if (key === 'isInsurance') {
            saveState();
            renderWorkspace();
        } else {
            calculateInstance(id);
            saveState();
        }
    }

    function calculateInstance(id) {
        const inst = accaInstances.find(item => item.id === id);
        if (!inst) return;

        const isSNR = (inst.betType === 'snr');
        const bStake = parseFloat(inst.backStake) || 0;
        const bOdds = parseFloat(inst.backOdds) || 0;
        
        const backReturn = isSNR ? (bStake * (bOdds - 1)) : (bStake * bOdds);
        const backCost = isSNR ? 0 : bStake;
        const numLegs = inst.legs.length;

        const biasFactor = inst.isInsurance ? 1 : (parseFloat(inst.underlayBias) || 0) / 100;

        const expectedRefund = inst.isInsurance 
            ? (parseFloat(inst.refundValue) || 0) * ((parseFloat(inst.refundRetention) || 0) / 100) 
            : 0;

        let layMainAdv = new Array(numLegs).fill(0);
        let layRecAdv = new Array(numLegs).fill(0);
        
        let V0 = backReturn;
        let V1 = expectedRefund;

        for (let i = numLegs - 1; i >= 0; i--) {
            const lOdds = parseFloat(inst.legs[i].odds) || 0;
            const lComm = (parseFloat(inst.legs[i].commission) || 0) / 100;
            const denom = (lOdds - lComm);

            if (lOdds > 1 && denom > 0) {
                layRecAdv[i] = V1 / denom;
                layMainAdv[i] = (V0 - V1) / denom;
            }

            V1 = layRecAdv[i] * (1 - lComm);
            V0 = V1 + (layMainAdv[i] * (1 - lComm));
        }

        if (!inst.isInsurance) {
            let standardLays = [];
            let runLiabilityStd = 0;
            for (let i = 0; i < numLegs; i++) {
                const lOdds = parseFloat(inst.legs[i].odds) || 0;
                const lComm = (parseFloat(inst.legs[i].commission) || 0) / 100;
                let stdLay = (lOdds > lComm && lOdds > 1) ? (backCost + runLiabilityStd) / (1 - lComm) : 0;
                standardLays.push(stdLay);
                runLiabilityStd += stdLay * (Math.max(1, lOdds) - 1);
                
                layMainAdv[i] = standardLays[i] + (biasFactor * (layMainAdv[i] - standardLays[i]));
            }
        }

        let cumulativeLiabilityIfWon = 0;
        let legsData = [];

        inst.legs.forEach((leg, i) => {
            const advised = layMainAdv[i];
            const advisedRec = layRecAdv[i];
            
            // Calculate existing matched partial lays on this leg
            let pStakeSum = 0;
            let pLiabilitySum = 0;
            let pNetPayoutSum = 0;

            if (leg.partialLays && leg.partialLays.length > 0) {
                leg.partialLays.forEach(p => {
                    let ps = parseFloat(p.stake) || 0;
                    let po = parseFloat(p.odds) || 0;
                    let pc = (parseFloat(p.comm !== "" && p.comm !== undefined ? p.comm : leg.commission) || 0) / 100;
                    
                    pStakeSum += ps;
                    pLiabilitySum += ps * Math.max(0, po - 1);
                    pNetPayoutSum += ps * (1 - pc);
                });
            }

            const usedVal = parseFloat(leg.actualLay);
            const actualUsedRemaining = isNaN(usedVal) ? Math.max(0, advised - pStakeSum) : usedVal;
            
            const lOdds = parseFloat(leg.odds) || 0;
            const lComm = (parseFloat(leg.commission) || 0) / 100;
            
            const remainingLiability = actualUsedRemaining * (Math.max(1, lOdds) - 1);
            const totalLegLiability = pLiabilitySum + remainingLiability;
            const totalLegNetPayout = pNetPayoutSum + (actualUsedRemaining * (1 - lComm));
            const totalLegStake = pStakeSum + actualUsedRemaining;

            const liabilityRec = advisedRec * (Math.max(1, lOdds) - 1);
            
            cumulativeLiabilityIfWon += totalLegLiability;
            
            legsData.push({ 
                advised, 
                actualUsedRemaining, 
                totalLegStake,
                totalLegLiability, 
                totalLegNetPayout,
                liabilityRec 
            });
            
            const advisedDisplay = document.getElementById(`advised_${id}_${i}`);
            const liabDisplay = document.getElementById(`liab_${id}_${i}`);
            const inputEl = document.getElementById(`override_${id}_${i}`);
            const sliderEl = document.getElementById(`slider_${id}_${i}`);
            
            if (advisedDisplay) {
                let recText = (inst.isInsurance && i > 0) ? `<br><span class="rec-lay-text">If 1 prior loss: £${advisedRec.toFixed(2)}</span>` : '';
                advisedDisplay.innerHTML = `£${advised.toFixed(2)}${recText}`;
            }
            if (liabDisplay) {
                let recText = (inst.isInsurance && i > 0) ? `<br><span class="rec-lay-text">If 1 prior loss: £${liabilityRec.toFixed(2)}</span>` : '';
                liabDisplay.innerHTML = `£${totalLegLiability.toFixed(2)}${recText}`;
            }
            
            if (inputEl && document.activeElement !== inputEl) {
                inputEl.value = (leg.actualLay === '' || leg.actualLay === undefined) ? '' : actualUsedRemaining.toFixed(2);
                inputEl.placeholder = `£${Math.max(0, advised - pStakeSum).toFixed(2)}`;
            }
            
            if (sliderEl) {
                const calculatedMax = Math.max(advised * 2, actualUsedRemaining, 0.01);
                sliderEl.max = calculatedMax.toFixed(2);
                if (document.activeElement !== sliderEl) {
                    sliderEl.value = actualUsedRemaining.toFixed(2);
                }
            }
        });

        const resultsTable = document.getElementById(`results_${id}`);
        if (!resultsTable) return;

        let html = '';
        legsData.forEach((ld, i) => {
            const leg = inst.legs[i];
            
            const netLayPayout = ld.totalLegNetPayout;
            const priorLiabilities = legsData.slice(0, i).reduce((sum, item) => sum + item.totalLegLiability, 0);
            const backPL = -backCost; 
            const displayBackPL = Math.abs(backPL) < 0.01 ? 0 : backPL;
            
            let recoveryLiabilities = 0;
            if (inst.isInsurance) {
                for (let j = i + 1; j < numLegs; j++) {
                    recoveryLiabilities += layRecAdv[j] * (Math.max(1, parseFloat(inst.legs[j].odds)) - 1);
                }
            }
            
            const totalLiabilitiesPaid = priorLiabilities + recoveryLiabilities;
            const netProfitIfLegLoses = netLayPayout + backPL - totalLiabilitiesPaid + expectedRefund;
            const displayNet = Math.abs(netProfitIfLegLoses) < 0.01 ? 0 : netProfitIfLegLoses;
            
            let pathHtml = '<div class="path-container">';
            for(let p = 0; p < i; p++) {
                pathHtml += `<span class="path-badge win">W</span><span class="path-arrow">→</span>`;
            }
            pathHtml += `<span class="path-badge loss">L</span></div>`;

            const refundColumnHtml = inst.isInsurance ? `<td data-label="Expected Refund" class="refund-cell">+£${expectedRefund.toFixed(2)}</td>` : '';

            html += `<tr>
                <td data-label="Event Path">${pathHtml}</td>
                <td data-label="Scenario Outcome"><strong>${leg.name || `Leg ${i+1}`} Fails</strong></td>
                <td data-label="Back Bet P/L" style="color:${backPL < 0 ? 'var(--danger)' : 'var(--text-muted)'}">${backPL < 0 ? '-£' : '£'}${Math.abs(displayBackPL).toFixed(2)}</td>
                <td data-label="Lay Win (Net)" style="color:var(--success)">+£${netLayPayout.toFixed(2)}</td>
                <td data-label="Liabilities Paid" style="color:${totalLiabilitiesPaid > 0 ? 'var(--danger)' : 'var(--text-muted)'}">${totalLiabilitiesPaid > 0 ? '-£' : '£'}${totalLiabilitiesPaid.toFixed(2)}</td>
                ${refundColumnHtml}
                <td data-label="Net P&L Result" class="${displayNet >= 0 ? 'win-cell' : 'loss-cell'} mono-text">£${displayNet.toFixed(2)}</td>
            </tr>`;
        });

        let allWinPathHtml = '<div class="path-container">';
        for(let p = 0; p < numLegs; p++) {
            allWinPathHtml += `<span class="path-badge win">W</span>`;
            if (p < numLegs - 1) allWinPathHtml += `<span class="path-arrow">→</span>`;
        }
        allWinPathHtml += '</div>';

        const backWinPL = backReturn - backCost;
        const displayBackWinPL = Math.abs(backWinPL) < 0.01 ? 0 : backWinPL;
        const finalNet = backWinPL - cumulativeLiabilityIfWon;
        const displayFinalNet = Math.abs(finalNet) < 0.01 ? 0 : finalNet;
        
        const refundColumnEmptyHtml = inst.isInsurance ? `<td data-label="Expected Refund" style="color:var(--text-muted)">-</td>` : '';

        html += `<tr style="border-top:2px solid var(--border-hover);">
            <td data-label="Event Path">${allWinPathHtml}</td>
            <td data-label="Scenario Outcome"><strong>All Legs Win</strong></td>
            <td data-label="Back Bet P/L" style="color:var(--success)">+£${displayBackWinPL.toFixed(2)}</td>
            <td data-label="Lay Win (Net)" style="color:var(--text-muted)">-</td>
            <td data-label="Liabilities Paid" style="color:var(--danger)">-£${cumulativeLiabilityIfWon.toFixed(2)}</td>
            ${refundColumnEmptyHtml}
            <td data-label="Net P&L Result" class="${displayFinalNet >= 0 ? 'win-cell' : 'loss-cell'} mono-text">£${displayFinalNet.toFixed(2)}</td>
        </tr>`;
        
        const tableHeaders = document.getElementById(`headers_${id}`);
        if(tableHeaders) {
            tableHeaders.innerHTML = `
                <tr>
                    <th>Event Path</th>
                    <th>Scenario Outcome</th>
                    <th>Back Bet P/L</th>
                    <th>Lay Win (Net)</th>
                    <th>Liabilities Paid</th>
                    ${inst.isInsurance ? `<th>Expected Refund</th>` : ''}
                    <th>Net P&L Result</th>
                </tr>
            `;
        }
        
        resultsTable.innerHTML = html;
    }

    function renderWorkspace() {
        const root = document.getElementById('workspaceRoot');
        root.innerHTML = '';
        
        accaInstances.forEach(inst => {
            const card = document.createElement('div');
            card.className = 'acca-card';
            
            let legsHtml = '';
            inst.legs.forEach((leg, index) => {
                const partialsCount = leg.partialLays ? leg.partialLays.length : 0;
                
                let partialRowsHtml = '';
                if (leg.partialLays && leg.partialLays.length > 0) {
                    partialRowsHtml = leg.partialLays.map((p, pIdx) => `
                        <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px; background: rgba(0,0,0,0.3); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);">
                            <div style="flex:1;">
                                <input type="number" step="0.01" value="${p.stake}" placeholder="Stake (£)" style="padding:4px 8px; font-size:0.8rem;" oninput="updatePartialLay(${inst.id}, ${index}, ${pIdx}, 'stake', this.value)">
                            </div>
                            <div style="flex:1;">
                                <input type="number" step="0.01" value="${p.odds}" placeholder="Odds" style="padding:4px 8px; font-size:0.8rem;" oninput="updatePartialLay(${inst.id}, ${index}, ${pIdx}, 'odds', this.value)">
                            </div>
                            <button class="btn" style="background:transparent; color:var(--danger); border:1px solid var(--danger); padding:2px 8px; font-size:0.75rem;" onclick="removePartialLay(${inst.id}, ${index}, ${pIdx})">✕</button>
                        </div>
                    `).join('');
                }

                legsHtml += `
                    <div class="leg-row ${leg.completed ? 'completed' : ''}" id="leg_row_${inst.id}_${index}">
                        <div class="leg-num">#${index + 1}</div>
                        <div class="input-wrap" data-label="Event / Selection">
                            <textarea rows="1" placeholder="Event" oninput="updateField(${inst.id}, 'name', this.value, ${index}); autoGrow(this)">${leg.name}</textarea>
                        </div>
                        <div class="input-wrap" data-label="Lay Odds">
                            <input type="number" value="${leg.odds}" step="0.05" placeholder="Odds" oninput="updateField(${inst.id}, 'odds', this.value, ${index})">
                        </div>
                        <div class="input-wrap" data-label="Comm %">
                            <input type="number" value="${leg.commission}" step="0.5" placeholder="0" oninput="updateField(${inst.id}, 'commission', this.value, ${index})">
                        </div>
                        <div class="input-wrap" data-label="Advised Lays">
                            <div class="advised-display" data-mobile-label="Advised Lays:" id="advised_${inst.id}_${index}">£0.00</div>
                        </div>
                        <div class="input-wrap" data-label="Liability">
                            <div class="advised-display liab-display" data-mobile-label="Liability:" id="liab_${inst.id}_${index}">£0.00</div>
                        </div>
                        
                        <div class="actual-lay-group" data-label="Actual Lay Stake">
                            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
                                <button class="btn" style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border); padding: 2px 6px; font-size: 0.65rem; border-radius: 4px;" onclick="addPartialLay(${inst.id}, ${index})">+ Add Matched Lay</button>
                                <button class="btn" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 2px 6px; font-size: 0.65rem; border-radius: 4px;" onclick="updateField(${inst.id}, 'actualLay', '', ${index})" title="Reset to Advised stake">↺ Advised</button>
                            </div>
                            <input type="number" id="override_${inst.id}_${index}" class="override-input" value="${leg.actualLay || ''}" placeholder="${partialsCount > 0 ? 'Remaining Lay' : '£0.00'}" step="0.01" oninput="updateField(${inst.id}, 'actualLay', this.value, ${index})">
                            <input type="range" id="slider_${inst.id}_${index}" class="lay-slider" min="0" max="100" step="0.01" value="${leg.actualLay || 0}" oninput="updateField(${inst.id}, 'actualLay', this.value, ${index})">
                            ${partialRowsHtml}
                        </div>

                        <div class="leg-done">
                            <input type="checkbox" class="done-checkbox" title="Mark as complete" ${leg.completed ? 'checked' : ''} onchange="updateField(${inst.id}, 'completed', this.checked, ${index})">
                        </div>
                        <div class="input-wrap" data-label="Notes">
                            <textarea rows="1" class="notes-input" placeholder="Notes" oninput="updateField(${inst.id}, 'notes', this.value, ${index}); autoGrow(this)">${leg.notes}</textarea>
                        </div>
                        <button class="btn-secondary close-btn" style="border-radius:8px; width:32px; height:32px; padding:0; border:none; cursor:pointer;" onclick="removeLegFromInstance(${inst.id}, ${index})" ${inst.legs.length <= 2 ? 'disabled style="opacity:0.2;"' : ''}>✕</button>
                    </div>
                `;
            });

            const insurancePanelHtml = inst.isInsurance ? `
                <div class="insurance-panel">
                    <div class="insurance-warning">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        If a leg fails, use the 'If 1 prior loss' stakes for the remaining legs to secure your refund. Strategy is forced to 100% Lock-in.
                    </div>
                    <div>
                        <label style="color:var(--success);">Refund Amount (£)</label>
                        <input type="number" step="1" value="${inst.refundValue}" oninput="updateField(${inst.id}, 'refundValue', this.value)">
                    </div>
                    <div>
                        <label style="color:var(--success);">Cash Retention (%)</label>
                        <input type="number" step="1" value="${inst.refundRetention}" oninput="updateField(${inst.id}, 'refundRetention', this.value)">
                    </div>
                </div>
            ` : '';

            card.innerHTML = `
                <div class="acca-header">
                    <input type="text" class="title-input" value="${inst.title}" oninput="updateField(${inst.id}, 'title', this.value)">
                    <div style="display: flex; gap: 10px; flex-shrink: 0;">
                        <button class="btn" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border);" onclick="resetCalc(${inst.id})">Reset</button>
                        <button class="btn btn-danger" onclick="removeInstance(${inst.id})">Close</button>
                    </div>
                </div>
                <div class="acca-body">
                    <div class="config-bar">
                        <div style="grid-column: 1 / -1; display:flex; gap:20px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:12px; margin-bottom:5px;">
                            <div class="toggle-wrap">
                                <input type="checkbox" id="ins_${inst.id}" ${inst.isInsurance ? 'checked' : ''} onchange="updateField(${inst.id}, 'isInsurance', this.checked)">
                                <label for="ins_${inst.id}"><strong>Acca Insurance Offer</strong> (Refund if 1 leg loses)</label>
                            </div>
                        </div>
                        
                        ${insurancePanelHtml}

                        <div>
                            <label>Bet Style</label>
                            <select onchange="updateField(${inst.id}, 'betType', this.value); calculateInstance(${inst.id});">
                                <option value="normal" ${inst.betType === 'normal' ? 'selected' : ''}>Normal Qualifying</option>
                                <option value="snr" ${inst.betType === 'snr' ? 'selected' : ''}>Free Bet (SNR)</option>
                            </select>
                        </div>
                        
                        <div class="strategy-group" id="strat_group_${inst.id}" style="grid-column: span 2; margin: 0; opacity: ${inst.isInsurance ? '0.3' : '1'}; pointer-events: ${inst.isInsurance ? 'none' : 'auto'}; border: none; padding: 0; background: transparent;">
                            <label style="color:var(--primary);">Underlay Strategy</label>
                            <div class="strategy-buttons" style="margin-bottom: 8px;">
                                <button class="btn-strat ${inst.underlayBias == 0 ? 'active' : ''}" data-val="0" onclick="updateField(${inst.id}, 'underlayBias', 0)">Standard (0%)</button>
                                <button class="btn-strat ${inst.underlayBias == 50 ? 'active' : ''}" data-val="50" onclick="updateField(${inst.id}, 'underlayBias', 50)">Partial (50%)</button>
                                <button class="btn-strat ${inst.underlayBias == 100 ? 'active' : ''}" data-val="100" onclick="updateField(${inst.id}, 'underlayBias', 100)">Lock-In (100%)</button>
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <div style="display:flex; align-items:center; gap: 4px;">
                                    <input type="number" id="bias_override_${inst.id}" class="override-input" step="1" value="${inst.isInsurance ? '100' : inst.underlayBias}" oninput="updateField(${inst.id}, 'underlayBias', this.value)" style="width: 70px; padding: 6px;">
                                    <span style="color: var(--text-muted); font-weight: 800; font-size: 0.9rem;">%</span>
                                </div>
                                <input type="range" id="bias_slider_${inst.id}" style="flex:1; margin:0;" min="0" max="100" step="1" value="${inst.isInsurance ? '100' : inst.underlayBias}" oninput="updateField(${inst.id}, 'underlayBias', this.value)">
                            </div>
                        </div>

                        <div>
                            <label>Back Stake (£)</label>
                            <input type="number" step="0.5" placeholder="0.00" value="${inst.backStake}" oninput="updateField(${inst.id}, 'backStake', this.value)">
                        </div>
                        <div>
                            <label>Total Back Odds</label>
                            <input type="number" value="${inst.backOdds}" placeholder="0.00" step="0.5" oninput="updateField(${inst.id}, 'backOdds', this.value)">
                        </div>
                    </div>
                    
                    <div style="display:flex; align-items:center; margin-bottom:12px; margin-top:25px;">
                        <h4 style="margin:0; color:var(--text-main); font-size: 1.1rem; font-weight: 800; display:flex; align-items:center; gap:8px;">
                            <span style="display:inline-block; width:8px; height:8px; background:var(--primary); border-radius:50%; box-shadow:0 0 8px var(--primary-glow);"></span>
                            Sequential Legs Setup
                        </h4>
                        <button class="btn btn-secondary" style="margin-left:auto; border-color:var(--primary); color:var(--primary);" onclick="addLegToInstance(${inst.id})" ${inst.legs.length >= 10 ? 'disabled' : ''}>+ Add Next Leg</button>
                    </div>
                    
                    <div class="legs-container">
                        <div class="leg-header-row">
                            <div>#</div>
                            <div>Event / Selection</div>
                            <div>Lay Odds</div>
                            <div>Comm %</div>
                            <div style="text-align: right; padding-right: 10px;">Advised Lays</div>
                            <div style="text-align: right; padding-right: 10px;">Liability</div>
                            <div>Actual Lay Stake</div>
                            <div style="text-align: center;">Done</div>
                            <div>Notes</div>
                            <div></div>
                        </div>
                        ${legsHtml}
                    </div>
                    
                    <div class="outputs-section" style="margin-top: 30px;">
                        <h4 style="margin:0; color:var(--text-main); font-size: 1.1rem; font-weight: 800; margin-bottom: 15px; display:flex; align-items:center; gap:8px;">
                            <span style="display:inline-block; width:8px; height:8px; background:var(--primary); border-radius:50%; box-shadow:0 0 8px var(--primary-glow);"></span>
                            Bet Settlement Calculations
                        </h4>
                        <div class="outputs-table-wrapper">
                            <table class="outputs-table">
                                <thead id="headers_${inst.id}">
                                    <!-- Populated by JS -->
                                </thead>
                                <tbody id="results_${inst.id}"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            root.appendChild(card);
            
            card.querySelectorAll('textarea').forEach(el => {
                autoGrow(el);
            });
            
            calculateInstance(inst.id);
        });
    }

    // Initialize the app and bind state management
    init();
</script>
</body>
</html>
